<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e24"/>
      <stop offset="1" stop-color="#0f1114"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc97a"/>
      <stop offset="1" stop-color="#2f7d4f"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)" stroke="#2f343d" stroke-width="2"/>

  <!-- Stylised device screen -->
  <rect x="38" y="26" width="52" height="76" rx="8" fill="#000000" stroke="#3a404b" stroke-width="2"/>
  <rect x="46" y="38" width="36" height="6" rx="3" fill="#2a2f37"/>
  <rect x="46" y="52" width="26" height="6" rx="3" fill="#2a2f37"/>

  <!-- Play / power accent -->
  <path d="M58 66 L58 88 L78 77 Z" fill="url(#accent)"/>
</svg>
